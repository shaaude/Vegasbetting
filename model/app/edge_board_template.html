<title>Edge Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a sticky header with league + section tabs over a single scrolling column of game cards;
   a bottom slip bar keeps the parlay in reach on phones. Dark-first terminal look: slate ground, amber for edges. */
:root {
  --bg: #121820; --panel: #1a222d; --panel-2: #212b38; --line: #2d3947; --fg: #e8edf3; --muted: #93a1b3;
  --accent: #f0b35a; --accent-ink: #1a1304; --good: #5fcf8a; --warn: #f2c14e; --bad: #ef6b6b; --info: #7cb8ff;
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif; --body: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f3f1ec; --panel: #ffffff; --panel-2: #f6f3ed; --line: #ddd7cc; --fg: #1d2129; --muted: #5d6673;
  --accent: #b9741a; --accent-ink: #ffffff; --good: #1f8f4e; --warn: #a66f00; --bad: #c43d3d; --info: #2466b8; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f3f1ec; --panel: #ffffff; --panel-2: #f6f3ed; --line: #ddd7cc; --fg: #1d2129; --muted: #5d6673;
  --accent: #b9741a; --accent-ink: #ffffff; --good: #1f8f4e; --warn: #a66f00; --bad: #c43d3d; --info: #2466b8; color-scheme: light; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 10px 4px; }
.brand h1 { font-family: var(--display); font-weight: 700; font-size: 28px; letter-spacing: .02em; margin: 0; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.live { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
.dot.partial { background: var(--warn); }
button { font: inherit; cursor: pointer; }
.btn { background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.btn:focus-visible, .tab:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 4px 8px; font-size: 12px; }
.leagues { display: flex; gap: 6px; padding-block: 6px; }
.tab { flex: 1; background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 8px; font-family: var(--display); font-size: 18px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.tab[aria-selected="true"] { background: var(--panel); color: var(--fg); border-color: var(--accent); }
.sections { display: flex; gap: 14px; overflow-x: auto; padding-block: 6px 10px; scrollbar-width: none; }
.sections button { background: none; border: 0; color: var(--muted); padding: 2px 0; font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent; }
.sections button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
main { padding-block: 12px 110px; }
.note { font-size: 12px; color: var(--muted); }
.banner { background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
.banner.bad { border-left-color: var(--bad); }
.grid { display: grid; gap: 10px; }
@media (min-width: 900px) { .grid.cards { grid-template-columns: 1fr 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.card .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }

.card h3 small { font-size: 14px; color: var(--muted); font-family: var(--body); font-weight: 500; }
.rank { color: var(--accent); font-family: var(--mono); font-size: 13px; margin-right: 2px; }
.qbs { font-size: 12px; color: var(--muted); }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.num { background: var(--panel-2); border-radius: 6px; padding: 6px 8px; min-width: 0; }
.num .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.num .v { font-family: var(--display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }

.chip.PLAY { background: var(--accent); color: var(--accent-ink); }
.chip.LEAN { background: color-mix(in srgb, var(--accent) 28%, transparent); color: var(--accent); }
.chip.PASS { background: var(--panel-2); color: var(--muted); }
.chip.NOLINE { background: var(--panel-2); color: var(--muted); }
.chip.cA { background: var(--good); color: var(--bg); } .chip.cB { background: color-mix(in srgb, var(--good) 30%, transparent); color: var(--good); }
.chip.cC { background: var(--panel-2); color: var(--fg); } .chip.c– { background: var(--panel-2); color: var(--muted); }
.chk { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 2px 6px; margin-top: 4px; }
.chk .y { color: var(--good); } .chk .n { color: var(--muted); }
.tierhead { display: flex; align-items: baseline; gap: 8px; margin: 14px 0 6px; } .tierhead h2 { margin: 0; }
.chip.risk { background: color-mix(in srgb, var(--bad) 30%, transparent); color: var(--bad); }
.chip.live { background: color-mix(in srgb, var(--good) 25%, transparent); color: var(--good); }
.chip.snap { background: var(--panel-2); color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }

.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--fg); font-weight: 600; }
.intel { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; font-size: 12.5px; }
.intel summary { cursor: pointer; color: var(--info); font-weight: 500; }
.kv { display: grid; grid-template-columns: auto 1fr 1fr; gap: 3px 10px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kv .h { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.kv div { min-width: 0; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.inj { margin-top: 6px; color: var(--muted); }
.inj b { color: var(--fg); font-weight: 500; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 12.5px; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
td.r, th.r { text-align: right; }
.tablewrap { overflow-x: auto; }
h2 { font-family: var(--display); font-size: 22px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; margin: 14px 0 8px; }
h2:first-child { margin-top: 0; }
.slip { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--panel); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.slip .in { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; }
.slip .big { font-family: var(--display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.legs { display: grid; gap: 6px; }
.leg { display: flex; justify-content: space-between; gap: 8px; align-items: center; background: var(--panel-2); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
.leg .x { background: none; border: 0; color: var(--muted); font-size: 16px; padding: 0 4px; }
.parlay-sum { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
@media (min-width: 560px) { .parlay-sum { grid-template-columns: repeat(4, 1fr); } }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
input[type="number"], select { font: inherit; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.gpick { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.gchip { background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 5px 8px; font-size: 12px; font-variant-numeric: tabular-nums; }
.gchip[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 22%, var(--panel-2)); border-color: var(--accent); color: var(--fg); }
.gchip small { color: var(--muted); font-size: 10.5px; margin-left: 4px; }
.gchip[aria-pressed="true"] small { color: var(--accent); }
.combo { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 8px; background: var(--panel); }
.combo .head { display: flex; justify-content: space-between; gap: 8px; font-family: var(--display); font-size: 18px; font-weight: 600; }
.combo ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
.method p { max-width: 68ch; }
.guide { display: grid; gap: 14px; }
@media (min-width: 980px) { .guide-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; } .guide-top .shot { position: sticky; top: 150px; } }
.shot { min-width: 0; }
.shot .frame { border: 1px dashed var(--line); border-radius: 10px; padding: 10px; background: var(--bg); }
.shot .cap { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
.shot .card { pointer-events: none; }
.co { position: relative; }
.mk { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: var(--info); color: var(--bg); font: 600 11px/1 var(--body); margin-right: 5px; vertical-align: 1px; flex: none; }
.num .mk { position: absolute; top: -7px; left: -7px; margin: 0; box-shadow: 0 0 0 2px var(--bg); }
.steps { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; }
.steps li .mk { margin-top: 2px; }
.steps h4 { margin: 0 0 2px; font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: .02em; }
.steps p { margin: 0 0 4px; max-width: 68ch; }
.ex { background: var(--panel-2); border-radius: 6px; padding: 6px 9px; font-variant-numeric: tabular-nums; font-size: 12.5px; margin-top: 4px; }
.guide table td, .guide table th { white-space: normal; }
.guide h2 { margin-top: 6px; }
.src { font-size: 12px; color: var(--muted); }
[data-x] { cursor: pointer; }
.num[data-x] { position: relative; border: 1px solid transparent; }
.num[data-x]::after { content: "?"; position: absolute; top: 5px; right: 7px; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--muted); color: var(--muted); font-size: 10px; line-height: 12px; text-align: center; opacity: .8; }
.num[data-x][aria-expanded="true"] { border-color: var(--accent); }
.num[data-x][aria-expanded="true"]::after { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
span[data-x], .chip[data-x], th[data-x], .kv .h[data-x] { text-decoration: underline dotted; text-underline-offset: 3px; text-decoration-color: var(--muted); }
span[data-x][aria-expanded="true"], .chip[data-x][aria-expanded="true"], .kv .h[data-x][aria-expanded="true"] { text-decoration-color: var(--accent); color: var(--accent); }
.explain { margin-top: 8px; background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; line-height: 1.5; position: relative; }
.explain .t { font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: .02em; margin-right: 24px; }
.explain .close { position: absolute; top: 4px; right: 6px; background: none; border: 0; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 4px; }
.explain p { margin: 4px 0 0; }
.explain b { font-weight: 600; }
.hint { font-size: 11px; color: var(--muted); margin: 0 0 8px; }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } .card.selected { border-color: var(--accent); } .explain { animation: pop .15s ease-out; } @keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } } }
.card.selected { border-color: var(--accent); }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Edge <span>Board</span></h1>
      <div class="status"><span class="dot" id="dot"></span><span id="status">Rebuilt</span></div>
    </div>
    <div class="leagues" role="tablist">
      <button class="tab" role="tab" data-league="nfl" aria-selected="true">NFL · Week 6</button>
      <button class="tab" role="tab" data-league="ncaa" aria-selected="false">NCAA · Sat Oct 17</button>
    </div>
    <div class="sections" role="tablist">
      <button role="tab" data-section="board" aria-selected="true">Board</button>
      <button role="tab" data-section="bets" aria-selected="false">Best bets</button>
      <button role="tab" data-section="parlays" aria-selected="false">Parlays</button>
      <button role="tab" data-section="ratings" aria-selected="false">Ratings</button>
      <button role="tab" data-section="method" aria-selected="false">Method & record</button>
      <button role="tab" data-section="guide" aria-selected="false">How to read</button>
      <button role="tab" data-section="info" aria-selected="false">Info</button>

  </div>
</header>

<main class="wrap">
  <div id="banner"></div>
  <section id="sec-board"></section>
  <section id="sec-bets" hidden></section>
  <section id="sec-parlays" hidden></section>
  <section id="sec-ratings" hidden></section>
  <section id="sec-method" hidden></section>
  <section id="sec-guide" hidden></section>
  <section id="sec-info" hidden></section>
</main>

<div class="slip wrap">
  <div class="in">
    <div><div class="note">Parlay slip · <span id="slipCount">0</span> legs</div><div class="big" id="slipProb">—</div></div>
    <div class="note" id="slipOdds"></div>
    <button class="btn primary" id="slipOpen">Build parlay</button>
  </div>
</div>

<script>
const DATA = __DATA__;
const LIVE_FETCH = __LIVE__;
const PAGES_URL = "https://shaaude.github.io/Vegasbetting/";
const SIGMA = { nfl: DATA.nfl.params.sigma, ncaa: DATA.ncaa.params.sigma };
const ALPHA = { nfl: DATA.nfl.params.alpha_market, ncaa: DATA.ncaa.params.alpha_market };
const TIERS = { nfl: { play: DATA.nfl.params.play_pts, lean: DATA.nfl.params.lean_pts }, ncaa: { play: DATA.ncaa.params.play_pts, lean: DATA.ncaa.params.lean_pts } };
const VIG = 0.045;
const state = { league: 'nfl', section: 'board', live: { nfl: {}, ncaa: {} }, kalshi: { nfl: {}, ncaa: {} }, poly: { nfl: {}, ncaa: {} },
  sources: {}, legs: [], nLegs: 3, side: {}, pool: 'tiers', poolGames: null, lockSlip: true, vary: true, legType: 'spread', fetchedAt: null };

// ---------- math ----------
function ncdf(z) { const t = 1 / (1 + 0.2316419 * Math.abs(z)); const d = 0.3989423 * Math.exp(-z * z / 2);
  let p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; }
function americanToDecimal(a) { a = Number(a); if (!a) return null; return a > 0 ? 1 + a / 100 : 1 + 100 / Math.abs(a); }
function decimalToAmerican(d) { if (!d || d <= 1) return '—'; const a = d >= 2 ? (d - 1) * 100 : -100 / (d - 1); return (a > 0 ? '+' : '') + Math.round(a); }
function fmtSpread(v) { if (v === null || v === undefined || Number.isNaN(v)) return '—'; const s = Number(v); return (s > 0 ? '+' : '') + s.toFixed(1).replace('.0', ''); }
function pct(p) { return p === null || p === undefined ? '—' : (100 * p).toFixed(0) + '%'; }
function pct1(p) { return p === null || p === undefined ? '—' : (100 * p).toFixed(1) + '%'; }
function sign(v, d = 1) { if (v === null || v === undefined) return '—'; const n = Number(v); return (n > 0 ? '+' : '') + n.toFixed(d); }
function cls(v) { return v > 0.05 ? 'pos' : v < -0.05 ? 'neg' : ''; }

// ---------- game view model ----------
function gameId(lg, g) { return lg === 'nfl' ? `${g.away}@${g.home}` : `${g.away}@${g.home}`; }
function marketFor(lg, g) {
  const live = state.live[lg][gameId(lg, g)];
  if (live && live.spread !== null && live.spread !== undefined) return { spread: live.spread, total: live.total, src: 'live', ml: live.ml };
  const snap = lg === 'nfl' ? g.current_spread : g.market_spread;
  return { spread: snap, total: g.total ?? g.total_line, src: 'snapshot', ml: null };
}
function view(lg, g) {
  const m = marketFor(lg, g); const s = SIGMA[lg]; const a = ALPHA[lg];
  const model = g.model_spread; const mkt = m.spread;
  const hasLine = mkt !== null && mkt !== undefined;
  const blend = hasLine ? a * mkt + (1 - a) * model : model;
  const edge = hasLine ? model - mkt : null;
  const tier = !hasLine ? 'NOLINE' : Math.abs(edge) >= TIERS[lg].play ? 'PLAY' : Math.abs(edge) >= TIERS[lg].lean ? 'LEAN' : 'PASS';
  const pHomeModel = ncdf(model / s), pHomeBlend = ncdf(blend / s), pHomeMkt = hasLine ? ncdf(mkt / s) : null;
  const pHomeCover = hasLine ? ncdf((blend - mkt) / s) : null;
  const pickHome = edge !== null ? edge > 0 : model > 0;
  const live = state.live[lg][gameId(lg, g)] || {};
  const k = state.kalshi[lg][gameId(lg, g)] || DATA[lg].kalshi[lg === 'nfl' ? g.game_key : gameId(lg, g)] || null;
  const poly = state.poly[lg][gameId(lg, g)] || null;
  // moneyline prices: live book prices if present, else market-implied with vig
  let mlHome = m.ml && m.ml.home ? americanToDecimal(m.ml.home) : null, mlAway = m.ml && m.ml.away ? americanToDecimal(m.ml.away) : null;
  if (!mlHome || !mlAway) { const ph = pHomeMkt ?? pHomeModel; mlHome = 1 / Math.min(0.99, ph + VIG / 2); mlAway = 1 / Math.min(0.99, (1 - ph) + VIG / 2); }
  const final = !!live.final || (g.result !== null && g.result !== undefined);
  const started = !final && (g.started === true || !!live.scoreText);
  const vv = { g, lg, id: gameId(lg, g), model, mkt, hasLine, blend, edge, tier, pHomeModel, pHomeBlend, pHomeMkt, pHomeCover, pickHome, live, kalshi: k, poly, final, started,
    locked: final || started, open: (g.open_spread !== undefined && g.open_spread !== null) ? g.open_spread : null, src: m.src, total: m.total, mlHome, mlAway, s };
  vv.conv = conviction(vv);
  return vv;
}
// Multi-tier conviction: independent checks on the model's side. Tier A = 5+, B = 3-4, C = 2.
function conviction(v) {
  if (!v.hasLine) return null;
  const g = v.g, lg = v.lg, sd = v.edge > 0 ? 1 : -1, team = sd > 0 ? g.home : g.away;
  const pc = sd > 0 ? v.pHomeCover : 1 - v.pHomeCover; const ae = Math.abs(v.edge);
  const checks = [];
  const pts = ae >= TIERS[lg].play ? 2 : ae >= TIERS[lg].lean ? 1 : 0;
  checks.push({ k: 'Edge size', pts, max: 2, ok: pts > 0, d: `${ae.toFixed(1)} points toward ${team} (${TIERS[lg].lean}+ earns 1, ${TIERS[lg].play}+ earns 2)` });
  checks.push({ k: 'Beats the vig', pts: pc > 0.524 ? 1 : 0, max: 1, ok: pc > 0.524, d: `blended cover chance ${(100 * pc).toFixed(1)}% vs 52.4% breakeven` });
  let second = null, secondTxt = '';
  if (lg === 'nfl' && g.model_spread_pure !== null && g.model_spread_pure !== undefined) { second = g.model_spread_pure; secondTxt = 'pure-EPA variant'; }

          <p>"Cover ${pct1(pc)}" is the estimated chance ${pick} beats the spread. A standard −110 bet needs <b>52.4%</b> to break even, so this is the number to hold against that line.</p></div></li>

        <li>${mk(8)}<div><h4>Intelligence</h4><p>Opens the breakdown behind the model line: each team's power rating, the quarterback and injury adjustments, home field, rest and travel, the injury list, and the "if the backup starts" line when a QB is in doubt. The pieces add up to the model line in step 3.</p></div></li>

    </div>
  </div>

  <h2>The model versus the line, step by step</h2>
  <p>Every spread on this site is shown from the <b>home team's side</b>, in sportsbook notation: a minus sign means favored, a plus sign means getting points. "${H} −3" means ${H} must win by more than 3 to cover; "${H} +3" means ${H} covers if it wins or loses by fewer than 3.</p>
  <div class="tablewrap"><table>
    <tr><th>Piece</th><th>This game</th><th>How it is built</th></tr>
    <tr><td>Power ratings</td><td>${A} ${sign(g.rating_away)}, ${H} ${sign(g.rating_home)} → ${fav(gap)} by ${abs(gap)} on a neutral field</td><td>Points better or worse than an average team, from opponent-adjusted passing and rushing EPA blended with the ratings the betting market implies</td></tr>
    <tr><td>Home field</td><td>${sign(g.hfa)} to ${H}</td><td>League average plus a venue term</td></tr>
    <tr><td>Quarterbacks</td><td>${sign(qbd)} to ${H}</td><td>This week's starters valued against the quarterbacks who produced each team's numbers</td></tr>
    <tr><td>Injuries</td><td>${sign(inj)} to ${H}</td><td>Starters on the injury report, weighted by position and status, versus each team's usual injury burden</td></tr>
    <tr><td>Rest and travel</td><td>${sign(g.rest_adj + g.travel_adj)}</td><td>Time zones crossed; rest tested and set to zero</td></tr>
    <tr><td><b>Model line</b></td><td><b>${fav(v.model)} by ${abs(v.model)}</b> (${H} ${fmtSpread(-v.model)})</td><td>Sum of the rows above</td></tr>
    <tr><td><b>Market line</b></td><td><b>${fav(v.mkt)} by ${abs(v.mkt)}</b> (${H} ${fmtSpread(-v.mkt)})</td><td>The sportsbook's number</td></tr>
    <tr><td><b>Edge</b></td><td><b>${sign(v.edge)} toward ${pick}</b></td><td>Model minus market</td></tr>
  </table></div>
  <div class="ex">Worked example: ${bookLine(pick, v.mkt)} at −110. The model thinks the fair line is ${bookLine(pick, v.model)}, so it believes the bet is worth about ${abs(v.edge)} points of cushion. Blending ${Math.round(100 * (1 - ALPHA.nfl))}% model and ${Math.round(100 * ALPHA.nfl)}% market turns that cushion into a cover chance of ${pct1(pc)}, against a 52.4% breakeven${pc > 0.53 ? ', a modest positive expectation' : pc > 0.524 ? ', a thin edge over the vig' : '. That is right at breakeven: the disagreement is real, but once the market gets most of the weight it does not clear the vig on its own. This is why tiers flag disagreements and the cover chance decides whether a bet is worth it'}.</div>

  <h3>How to judge an edge</h3>
  <p><b>Size matters, up to a point.</b> Over 448 NFL games in 2024–25, edges of 2.5–4 points covered 54% against the closing line, edges under 1 point were a coin flip, and edges of 4+ were no better than 2.5–4, because the biggest gaps are often the model missing something the market knows.</p>
  <p><b>Why the edge exists matters more.</b> An edge driven by a quarterback change or a late injury the line hasn't absorbed is the most trustworthy kind. An edge that comes only from the power ratings is the model disagreeing with a market that has more information.</p>
  <p><b>Watch the line move.</b> If the line moves toward the model after it opens, the market is agreeing with it (in Weeks 4–5 the line moved toward the model's side in about two of every three games that moved). If it moves away, the market knows something; the edge shrinks or flips.</p>
  <p><b>Openers versus current lines.</b> The model did best against opening lines. By kickoff the market has priced most news, so a LEAN at the opener can be a PASS at the close.</p>
  <p><b>College is different.</b> The college model has no injury or quarterback data and only about six games per team, and its big disagreements lost this season. Read college edges as "look closer", not "bet".</p>

  <h3>Conviction tiers (A / B / C)</h3>
  <p>PLAY and LEAN only measure the size of the gap. The <b>Conv</b> chip stacks independent checks on the model's side: the gap itself (up to 2 points), whether the cover chance beats 52.4%, whether a second model agrees (the pure-EPA variant in the NFL, Elo in college), whether the line has moved toward the pick since it opened, whether Kalshi leans the same way, and in the NFL whether the edge comes from quarterback or injury news. <b>A</b> = 5+ checks, <b>B</b> = 3–4, <b>C</b> = 2. Tap the chip to see which checks passed. Best Bets is grouped by these tiers.</p>
  <h3>Probabilities and parlays</h3>
  <p>All probabilities assume the final margin lands on a bell curve around the expected margin, with a typical miss of about ${SIGMA.nfl} points in the NFL and ${SIGMA.ncaa} in college. A parlay's win chance multiplies its legs' chances: three legs at 53% each is 0.53 × 0.53 × 0.53 ≈ 15%. <b>Fair odds</b> is the payout that would make that break-even; <b>expected value</b> is win chance × book payout − 1, so a positive number means the price beats the estimate. Most parlays sit slightly negative, because the −110 vig compounds with every leg.</p>

  <h3>Before you bet: a short checklist</h3>
  <ul>
    <li>Is the market chip <b>live</b>, or are you reading a snapshot? Compare with your book's current number.</li>
    <li>Recompute the edge against <b>your</b> line: model line minus the line you can actually get.</li>
    <li>Open Intelligence: is the edge coming from a QB or injury change, or only from ratings?</li>
    <li>Is a <b>QB risk</b> chip showing? Check the "if the backup starts" line.</li>
    <li>Does Kalshi agree with the model or with the book?</li>
    <li>Cover chance above 52.4% at −110 is the bar; stakes stay small (quarter-Kelly, 3% cap).</li>
  </ul>
  <p class="note">For analysis only; no outcome is guaranteed.</p>
  </div>`;
}

function bucketLine(lg) {

  return `Backtest, ${nm}: ` + b.map(x => `${x.lo}–${x.hi === 99 ? '+' : x.hi} pt edges ${x.w}-${x.l} (${pct(x.pct)})`).join(' · ') + '.';
}
function explainText(key, lg, id, extra) {

        (lg === 'nfl' ? `<p>The main number leans on the market's own power ratings with an EPA tilt; the <b>pure prior</b> variant (${sp(H, -g.model_spread_pure)}) weights this season's play-by-play more heavily. When the two agree the read is more robust.</p>` : `<p>College ratings come from this season's play-by-play only (about six games per team), shrunk toward the ratings the posted spreads imply. Treat them as a second opinion rather than a sharper one.</p>`));

    case 'leg': { const l = state.legs.find(x => x.id === extra); if (!l) return ''; return t(l.label, `<p>${l.type === 'spread' ? `Chance ${l.team} covers this spread, from the blended margin: <b>${pct1(l.prob)}</b>; priced at −110 (${l.dec.toFixed(2)}x).` : `Chance ${l.team} wins outright, blended: <b>${pct1(l.prob)}</b>; moneyline ${decimalToAmerican(l.dec)} (${l.dec.toFixed(2)}x).`} Tap the × to remove the leg.</p>`); }

}
function closeExplain(panel) { panel.hidden = true; panel.innerHTML = ''; panel.dataset.key = ''; }

// ---------- live feeds ----------
function parseDetails(details, homeAbbr, awayAbbr, homeName, awayName) {
  if (!details) return null; const m = details.match(/^(.+?)\s([+-]?\d+(?:\.\d+)?)$/); if (!m) return details.toUpperCase() === 'EVEN' || details.toUpperCase() === 'PK' ? 0 : null;
  const fav = m[1].trim(), num = Math.abs(parseFloat(m[2])); const favHome = fav === homeAbbr || fav === homeName || (homeName && homeName.startsWith(fav));
  const favAway = fav === awayAbbr || fav === awayName || (awayName && awayName.startsWith(fav));
  if (favHome) return num; if (favAway) return -num; return null;
}
async function fetchESPN(lg) {
  const urls = lg === 'nfl' ? ['https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard']
    : ['https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&dates=20261017&limit=120', 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&dates=20261016&limit=60'];
  const out = {};
  for (const u of urls) {
    const r = await fetch(u); if (!r.ok) throw new Error('espn ' + r.status); const j = await r.json();
    for (const ev of j.events || []) { const comp = ev.competitions && ev.competitions[0]; if (!comp) continue;
      const home = comp.competitors.find(c => c.homeAway === 'home'), away = comp.competitors.find(c => c.homeAway === 'away'); if (!home || !away) continue;
      let hk, ak; if (lg === 'nfl') { hk = DATA.nfl.espn_abbr[home.team.abbreviation] || home.team.abbreviation; ak = DATA.nfl.espn_abbr[away.team.abbreviation] || away.team.abbreviation; }
      else { hk = home.team.location; ak = away.team.location; }
      const key = `${ak}@${hk}`; const o = (comp.odds && comp.odds[0]) || null;
      let spread = null, total = null, ml = null;
      if (o) { spread = parseDetails(o.details, home.team.abbreviation, away.team.abbreviation, home.team.location, away.team.location);
        if (spread === null && typeof o.spread === 'number') spread = -o.spread; total = o.overUnder ?? null;
        const hm = (o.homeTeamOdds && (o.homeTeamOdds.moneyLine ?? o.homeTeamOdds.current?.moneyLine?.american)) ?? null;
        const am = (o.awayTeamOdds && (o.awayTeamOdds.moneyLine ?? o.awayTeamOdds.current?.moneyLine?.american)) ?? null;
        if (hm && am) ml = { home: hm, away: am }; }
      const st = comp.status && comp.status.type; const final = st && st.completed;
      out[key] = { spread, total, ml, state: st ? st.shortDetail : '', scoreText: (st && st.state !== 'pre') ? `${ak} ${away.score} – ${hk} ${home.score}` : '', final: !!final };
    }
  }
  return out;
}
function kalshiTeamKey(lg, sub) {
  if (lg === 'nfl') { if (DATA.nfl.cities[sub]) return DATA.nfl.cities[sub]; const k = Object.keys(DATA.nfl.cities).find(c => sub.startsWith(c)); return k ? DATA.nfl.cities[k] : null; }
  return sub.replace(/\bSt\.$/, 'State').replace(/\bSt\. /, 'State ');
}
async function fetchKalshi(lg) {
  const series = lg === 'nfl' ? 'KXNFLGAME' : 'KXNCAAFGAME'; const tags = lg === 'nfl' ? ['26OCT18', '26OCT19'] : ['26OCT17', '26OCT16'];
  const r = await fetch(`https://api.elections.kalshi.com/trade-api/v2/markets?series_ticker=${series}&status=open&limit=1000`); if (!r.ok) throw new Error('kalshi ' + r.status);
  const j = await r.json(); const byEvent = {};
  for (const m of j.markets || []) { if (!tags.some(t => m.event_ticker.includes(t))) continue;
    const team = kalshiTeamKey(lg, m.yes_sub_title || ''); if (!team) continue;
    const price = (m.yes_bid && m.yes_ask) ? (m.yes_bid + m.yes_ask) / 2 : (m.last_price || null); if (price === null) continue;
    (byEvent[m.event_ticker] = byEvent[m.event_ticker] || {})[team] = price > 1 ? price / 100 : price; }
  const out = {};
  for (const v of allViews(lg)) { for (const teams of Object.values(byEvent)) { const names = Object.keys(teams);
      const hm = names.find(t => t === v.g.home || v.g.home.startsWith(t) || t.startsWith(v.g.home)), am = names.find(t => t === v.g.away || v.g.away.startsWith(t) || t.startsWith(v.g.away));
      if (hm && am) { out[v.id] = { [v.g.home]: teams[hm], [v.g.away]: teams[am] }; break; } } }
  return out;
}
async function fetchPolymarket(lg) {
  const tag = lg === 'nfl' ? 'nfl' : 'college-football';
  const r = await fetch(`https://gamma-api.polymarket.com/events?tag_slug=${tag}&active=true&closed=false&limit=200`); if (!r.ok) throw new Error('poly ' + r.status);
  const evs = await r.json(); const out = {};
  for (const v of allViews(lg)) { const names = lg === 'nfl' ? Object.entries(DATA.nfl.nicknames).filter(([, a]) => a === v.g.home || a === v.g.away).map(([n, a]) => [n, a]) : [[v.g.home, v.g.home], [v.g.away, v.g.away]];
    for (const ev of evs) { const t = (ev.title || ''); if (!names.every(([n]) => t.includes(n))) continue; const m = (ev.markets || [])[0]; if (!m) continue;
      try { const oc = JSON.parse(m.outcomes || '[]'), op = JSON.parse(m.outcomePrices || '[]'); const res = {};
        oc.forEach((o, i) => { const hit = names.find(([n]) => o.includes(n) || n.includes(o)); if (hit) res[hit[1]] = parseFloat(op[i]); });
        if (res[v.g.home] !== undefined && res[v.g.away] !== undefined) { out[v.id] = res; break; } } catch (e) { /* skip */ } } }
  return out;
}
async function refresh() {
  document.getElementById('status').textContent = 'Refreshing…';
  const jobs = [['espn', async () => { state.live.nfl = await fetchESPN('nfl'); state.live.ncaa = await fetchESPN('ncaa'); }],
                ['kalshi', async () => { state.kalshi.nfl = await fetchKalshi('nfl'); state.kalshi.ncaa = await fetchKalshi('ncaa'); }],
                ['polymarket', async () => { state.poly.nfl = await fetchPolymarket('nfl'); state.poly.ncaa = await fetchPolymarket('ncaa'); }]];
  await Promise.all(jobs.map(async ([k, f]) => { try { await f(); state.sources[k] = true; } catch (e) { state.sources[k] = false; } }));
  state.fetchedAt = new Date(); const ok = Object.values(state.sources).filter(Boolean).length;
  const dot = document.getElementById('dot'); dot.className = 'dot ' + (ok === 3 ? 'live' : ok ? 'partial' : '');
  document.getElementById('status').textContent = ok ? `Live · ${state.fetchedAt.toLocaleTimeString()}` : `Snapshot · ${DATA.generated_at.replace(' UTC', 'Z')}`;
  // re-price legs already on the slip
  state.legs = state.legs.map(l => { const v = allViews(l.lg).find(x => x.id === l.game); return v ? legFor(v, l.type, l.side) : l; });
  renderAll(); showSection(state.section);
}
