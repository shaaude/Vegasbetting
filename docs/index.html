  <h3>How to judge an edge</h3>
  <p><b>Size matters, up to a point.</b> Over 448 NFL games in 2024–25, edges of 2.5–4 points covered 54% against the closing line, edges under 1 point were a coin flip, and edges of 4+ were no better than 2.5–4, because the biggest gaps are often the model missing something the market knows.</p>
  <p><b>Why the edge exists matters more.</b> An edge driven by a quarterback change or a late injury the line hasn't absorbed is the most trustworthy kind. An edge that comes only from the power ratings is the model disagreeing with a market that has more information.</p>
  <p><b>Watch the line move.</b> If the line moves toward the model after it opens, the market is agreeing with it (in Weeks 4–5 the line moved toward the model's side in about two of every three games that moved). If it moves away, the market knows something; the edge shrinks or flips.</p>
  <p><b>Openers versus current lines.</b> The model did best against opening lines. By kickoff the market has priced most news, so a LEAN at the opener can be a PASS at the close.</p>
  <p><b>College is different.</b> The college model has no injury or quarterback data and only about six games per team, and its big disagreements lost this season. Read college edges as "look closer", not "bet".</p>

  <h3>Conviction tiers (A / B / C)</h3>
  <p>PLAY and LEAN only measure the size of the gap. The <b>Conv</b> chip stacks independent checks on the model's side: the gap itself (up to 2 points), whether the cover chance beats 52.4%, whether a second model agrees (the pure-EPA variant in the NFL, Elo in college), whether the line has moved toward the pick since it opened, whether Kalshi leans the same way, and in the NFL whether the edge comes from quarterback or injury news. <b>A</b> = 5+ checks, <b>B</b> = 3–4, <b>C</b> = 2. Tap the chip to see which checks passed. Best Bets is grouped by these tiers.</p>
  <h3>Probabilities and parlays</h3>
  <p>All probabilities assume the final margin lands on a bell curve around the expected margin, with a typical miss of about ${SIGMA.nfl} points in the NFL and ${SIGMA.ncaa} in college. A parlay's win chance multiplies its legs' chances: three legs at 53% each is 0.53 × 0.53 × 0.53 ≈ 15%. <b>Fair odds</b> is the payout that would make that break-even; <b>expected value</b> is win chance × book payout − 1, so a positive number means the price beats the estimate. Most parlays sit slightly negative, because the −110 vig compounds with every leg.</p>

    const price = (m.yes_bid && m.yes_ask) ? (m.yes_bid + m.yes_ask) / 2 : (m.last_price || null); if (price === null) continue;
    (byEvent[m.event_ticker] = byEvent[m.event_ticker] || {})[team] = price > 1 ? price / 100 : price; }
  const out = {};
  for (const v of allViews(lg)) { for (const teams of Object.values(byEvent)) { const names = Object.keys(teams);
      const hm = names.find(t => t === v.g.home || v.g.home.startsWith(t) || t.startsWith(v.g.home)), am = names.find(t => t === v.g.away || v.g.away.startsWith(t) || t.startsWith(v.g.away));
      if (hm && am) { out[v.id] = { [v.g.home]: teams[hm], [v.g.away]: teams[am] }; break; } } }
  return out;
}
async function fetchPolymarket(lg) {
  const tag = lg === 'nfl' ? 'nfl' : 'college-football';
  const r = await fetch(`https://gamma-api.polymarket.com/events?tag_slug=${tag}&active=true&closed=false&limit=200`); if (!r.ok) throw new Error('poly ' + r.status);
  const evs = await r.json(); const out = {};
  for (const v of allViews(lg)) { const names = lg === 'nfl' ? Object.entries(DATA.nfl.nicknames).filter(([, a]) => a === v.g.home || a === v.g.away).map(([n, a]) => [n, a]) : [[v.g.home, v.g.home], [v.g.away, v.g.away]];
    for (const ev of evs) { const t = (ev.title || ''); if (!names.every(([n]) => t.includes(n))) continue; const m = (ev.markets || [])[0]; if (!m) continue;
      try { const oc = JSON.parse(m.outcomes || '[]'), op = JSON.parse(m.outcomePrices || '[]'); const res = {};
        oc.forEach((o, i) => { const hit = names.find(([n]) => o.includes(n) || n.includes(o)); if (hit) res[hit[1]] = parseFloat(op[i]); });
        if (res[v.g.home] !== undefined && res[v.g.away] !== undefined) { out[v.id] = res; break; } } catch (e) { /* skip */ } } }
  return out;
}
async function refresh() {
  document.getElementById('status').textContent = 'Refreshing…';
  const jobs = [['espn', async () => { state.live.nfl = await fetchESPN('nfl'); state.live.ncaa = await fetchESPN('ncaa'); }],
                ['kalshi', async () => { state.kalshi.nfl = await fetchKalshi('nfl'); state.kalshi.ncaa = await fetchKalshi('ncaa'); }],
                ['polymarket', async () => { state.poly.nfl = await fetchPolymarket('nfl'); state.poly.ncaa = await fetchPolymarket('ncaa'); }]];
  await Promise.all(jobs.map(async ([k, f]) => { try { await f(); state.sources[k] = true; } catch (e) { state.sources[k] = false; } }));
  state.fetchedAt = new Date(); const ok = Object.values(state.sources).filter(Boolean).length;
  const dot = document.getElementById('dot'); dot.className = 'dot ' + (ok === 3 ? 'live' : ok ? 'partial' : '');
  document.getElementById('status').textContent = ok ? `Live · ${state.fetchedAt.toLocaleTimeString()}` : `Snapshot · ${DATA.generated_at.replace(' UTC', 'Z')}`;
  // re-price legs already on the slip
  state.legs = state.legs.map(l => { const v = allViews(l.lg).find(x => x.id === l.game); return v ? legFor(v, l.type, l.side) : l; });
  renderAll(); showSection(state.section);
}

if (LIVE_FETCH) { refresh(); setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 120000); }
